name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-supported-node:
    name: Check / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install -g "$(node -p 'require(\"./package.json\").packageManager')"
      - run: npm ci
      - run: npm run check

  # Preserve the existing required `check` context while making it aggregate
  # both supported Node lines.
  check:
    name: check
    if: always()
    needs: check-supported-node
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Node check
        env:
          RESULT: ${{ needs.check-supported-node.result }}
        run: test "$RESULT" = "success"

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm install -g "$(node -p 'require(\"./package.json\").packageManager')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @myskills-app/web
      - name: Run production-like API and web journey
        run: npm run test:e2e:fullstack

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: myskills_test
          POSTGRES_PASSWORD: myskills_test
          POSTGRES_DB: myskills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myskills_test -d myskills_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm install -g "$(node -p 'require(\"./package.json\").packageManager')"
      - run: npm ci
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://myskills_test:myskills_test@localhost:5432/myskills_test
