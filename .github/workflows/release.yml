name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Verify Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myskills_test
          POSTGRES_PASSWORD: myskills_test
          POSTGRES_USER: myskills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myskills_test -d myskills_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install declared npm version
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Verify tag matches package version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$expected" = "$GITHUB_REF_NAME"

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run web browser E2E
        run: npm run test:e2e -w @myskills-app/web

      - name: Run Postgres integration tests
        env:
          TEST_DATABASE_URL: postgres://myskills_test:myskills_test@localhost:5432/myskills_test
        run: npm run test:postgres

      - name: Create release artifacts
        run: npm run release:artifacts -- --require-tag --expected-tag "$GITHUB_REF_NAME"

      - name: Build API image
        run: docker build --target api -t myskills-app-api:${{ github.ref_name }} .

      - name: Build MCP HTTP image
        run: docker build --target mcp-http -t myskills-app-mcp-http:${{ github.ref_name }} .

      - name: Build web image
        run: docker build --target web --build-arg VITE_API_BASE_URL=/api -t myskills-app-web:${{ github.ref_name }} .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myskills-app-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
